[package]
name = "supercapture-transcribe"
version = "0.1.0"
edition = "2024"

[dependencies]
transcribe-rs = { version = "=0.2.2", features = ["parakeet"] }
ort = "=2.0.0-rc.10"
hound = "3.5.1"
rubato = "0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
